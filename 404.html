<!DOCTYPE html>
<!--
  404.html - page shown by GitHub Pages for any address that does not exist. Uses root-relative links because it can appear at any address.
  Plain HTML: edit the words directly between the tags. The header and footer
  are repeated on every page, so a change there needs making on each page.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Sumtrol Software</title>
<meta name="description" content="Page not found.">
<link rel="canonical" href="https://software.sumtrol.uk/404.html">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1f23" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Page not found · Sumtrol Software">
<meta property="og:description" content="Page not found.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://software.sumtrol.uk/404.html">
<link rel="stylesheet" href="/assets/css/site.css">
<script src="/assets/js/site.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/">Sumtrol Software</a>
    <div class="header-right">
      <nav class="site-nav" aria-label="Main">
        <a href="/">Apps</a>
        <a href="/about/">About</a>
      </nav>
      <div class="theme-switch" role="group" aria-label="Colour theme">
        <button type="button" data-theme="light" aria-pressed="false">Light</button>
        <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
        <button type="button" data-theme="system" aria-pressed="true">System</button>
      </div>
    </div>
  </div>
</header>
<main id="main">
<div class="wrap narrow" style="padding:3rem 1.25rem">
<h1>Page not found</h1>
<p>That page doesn't exist, or has moved.</p>
<p><a class="btn" href="/">See all apps</a></p>
</div>
</main>
<footer class="site-footer">
  <div class="wrap">
    <span>Free software by Ian Packer.</span>
    <span><a href="/about/">About and contact</a></span>
  </div>
</footer>
</body>
</html>
